services:
  velo:
    image: ghcr.io/jeffpeng3/velo-docker:v0.7.8
    ports:
      - "8888:8888"
    volumes:
      # 掛 HF cache 的 repo 根目錄，snapshot 內的檔案是 ../../blobs 的相對 symlink。
      - "${HOME}/.cache/huggingface/hub/models--jeffpeng3--Swift-1.5-Qwen3.8-Flash-Next-EXL3-3.05bpw-heretic:/hf:ro"
    gpus: all
    command:
      - --server
      - --model-dir=/hf/snapshots/46b23dd204859c5f45c113d3f5ea532676e14149
      - --port=8888
      - --max-batch=4
      - --max-seq-len=262144
      - --prefix-cache=on
      - --mtp=auto
      - --ple-ram=ssd
      - --prefill-interleave=1
      - --model-name=model

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8888'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    restart: unless-stopped
