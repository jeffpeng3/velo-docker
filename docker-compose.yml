services:
  velo:
    image: ghcr.io/jeffpeng3/velo-docker:v0.7.9
    # gb10_inference 沒有安裝 SIGTERM handler，當 PID 1 時 kernel 會丟棄 SIGTERM，
    # docker stop 只能等滿 10s 後 SIGKILL。用 tini 當 PID 1 轉發訊號，關機 <1s。
    init: true
    ports:
      - "8888:8888"
    volumes:
      - "${HOME}/.cache/huggingface/hub:/hf:ro"
      - "./chat_template.zh_tw.jinja:/chat_template.jinja:ro"
    gpus: all
    environment:
      CUDA_DISABLE_PERF_BOOST: "1"
    command:
      - --server
      - --hf-cache=/hf
      - --model-dir
      - jeffpeng3/Swift-1.5-Qwen3.8-Flash-Next-EXL3-3.05bpw-heretic
      # --chat-template 只讀給定路徑，不會相對 model dir；用 repo 內的檔案，避免 snapshot hash。
      - --chat-template=/chat_template.jinja
      - --port=8888
      - --max-batch=2
      # 524288 = 模型原生 262144 × rope yarn 2.0。兩個 flag 必須成對，少一個會被 clamp 回 262144。
      - --max-seq-len=524288
      - --rope-yarn-factor=2.0
      - --kv-cache=q4k
      - --prefix-cache=on
      - --prefix-ckpt-mem-gb=4
      - --mtp=auto
      - --spec-lanes-max=auto
      - --lane-pack=on
      - --lane-order=rr
      - --prefill-chunk=4095
      - --prefill-interleave=1
      - --ple-ram=ssd
      - --model-name=model
      # image 沒有 curl，開機版號檢查本來就靜默；明寫避免以後裝 curl 時多出網路等待。
      - --no-update-check

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8888'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    restart: unless-stopped
